<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday Leave Time Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #202124;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 620px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #666;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #c9cdd3;
      border-radius: 7px;
      background: white;
    }

    .arrival {
      max-width: 220px;
    }

    .break-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .break-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .break-row {
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .row-top {
      display: flex;
      gap: 10px;
      align-items: end;
    }

    .name-field {
      flex: 1;
    }

    .mode-field {
      width: 170px;
    }

    .times {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .duration-field {
      margin-top: 12px;
      max-width: 220px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .add {
      background: #e8f0fe;
      color: #174ea6;
    }

    .remove {
      background: #fce8e6;
      color: #b3261e;
      padding: 8px 11px;
    }

    .result {
      text-align: center;
      background: #202124;
      color: white;
    }

    .result-label {
      color: #c7c7c7;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .leave-time {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .summary {
      margin-top: 12px;
      color: #c7c7c7;
      font-size: 14px;
    }

    .error {
      color: #b3261e;
      margin-top: 12px;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      .row-top {
        flex-wrap: wrap;
      }

      .mode-field {
        width: 100%;
      }

      .times {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Workday Leave Time Calculator</h1>
    <p class="subtitle">Calculate when you can leave after 8 hours of actual work.</p>

    <section class="card">
      <label for="arrival">Arrival time</label>
      <input class="arrival" id="arrival" type="time" value="08:00">
    </section>

    <section class="card">
      <div class="break-header">
        <h2>Lunch &amp; breaks</h2>
        <button class="add" id="addBreak">+ Add break</button>
      </div>
      <div id="breaks"></div>
      <div id="breakError" class="error"></div>
    </section>

    <section class="card">
      <label for="timeCredit">Time to subtract from today's workday</label>
      <input id="timeCredit" type="number" min="0" step="1" value="0"
             style="max-width:220px" placeholder="60">
      <div style="margin-top:7px;color:#666;font-size:14px;">
        Enter minutes you've already earned, e.g. 60 for one hour of extra time.
      </div>
    </section>

    <section class="card result">
      <div class="result-label">You can leave at</div>
      <div class="leave-time" id="leaveTime">4:00 PM</div>
      <div class="summary" id="summary">8 hours work + 0 minutes unpaid time</div>
    </section>
  </main>

  <script>
    const breaks = document.getElementById("breaks");
    const arrival = document.getElementById("arrival");
    const leaveTime = document.getElementById("leaveTime");
    const summary = document.getElementById("summary");
    const breakError = document.getElementById("breakError");
    const timeCredit = document.getElementById("timeCredit");

    function minutesFromTime(value) {
      if (!value) return null;
      const [hours, minutes] = value.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function formatTime(totalMinutes) {
      // Keep the calculation simple while allowing a leave time past midnight.
      totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;

      let hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      const suffix = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;

      return `${hours}:${String(minutes).padStart(2, "0")} ${suffix}`;
    }

    function createBreak() {
      const row = document.createElement("div");
      row.className = "break-row";

      row.innerHTML = `
        <div class="row-top">
          <div class="name-field">
            <label>Break name</label>
            <input type="text" class="break-name" placeholder="Lunch">
          </div>
          <div class="mode-field">
            <label>Enter by</label>
            <select class="mode">
              <option value="duration">Duration</option>
              <option value="times">Start / End</option>
            </select>
          </div>
          <button class="remove" type="button">Remove</button>
        </div>

        <div class="duration-field">
          <label>Minutes</label>
          <input type="number" class="duration" min="0" step="1" placeholder="60">
        </div>

        <div class="times" style="display:none;">
          <div>
            <label>Started</label>
            <input type="time" class="start">
          </div>
          <div>
            <label>Ended</label>
            <input type="time" class="end">
          </div>
        </div>
      `;

      row.querySelector(".mode").addEventListener("change", () => {
        const mode = row.querySelector(".mode").value;
        row.querySelector(".duration-field").style.display =
          mode === "duration" ? "" : "none";
        row.querySelector(".times").style.display =
          mode === "times" ? "grid" : "none";
        calculate();
      });

      row.querySelector(".remove").addEventListener("click", () => {
        row.remove();
        calculate();
      });

      row.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", calculate);
      });

      breaks.appendChild(row);
      calculate();
    }

    function calculate() {
      breakError.textContent = "";

      const arrivalMinutes = minutesFromTime(arrival.value);
      if (arrivalMinutes === null) return;

      let unpaidMinutes = 0;
      let invalid = false;

      document.querySelectorAll(".break-row").forEach(row => {
        const mode = row.querySelector(".mode").value;

        if (mode === "duration") {
          const value = row.querySelector(".duration").value;
          if (value !== "") {
            const duration = Number(value);
            if (duration >= 0) {
              unpaidMinutes += duration;
            }
          }
        } else {
          const start = minutesFromTime(row.querySelector(".start").value);
          const end = minutesFromTime(row.querySelector(".end").value);

          if (start !== null && end !== null) {
            let elapsed = end - start;

            // Treat an end time earlier than the start as crossing midnight.
            if (elapsed < 0) elapsed += 1440;

            unpaidMinutes += elapsed;
          } else if ((start !== null) !== (end !== null)) {
            invalid = true;
          }
        }
      });

      if (invalid) {
        breakError.textContent = "Enter both a start and end time for each Start / End break.";
      }

      const credit = Math.max(0, Number(timeCredit.value) || 0);
      const requiredWorkMinutes = Math.max(0, (8 * 60) - credit);
      const leaveMinutes = arrivalMinutes + requiredWorkMinutes + unpaidMinutes;

      leaveTime.textContent = formatTime(leaveMinutes);
      summary.textContent =
        `${requiredWorkMinutes / 60} hours work + ${unpaidMinutes} minute${unpaidMinutes === 1 ? "" : "s"} unpaid time` +
        (credit > 0 ? ` (${credit} minutes credited)` : "");
    }

    document.getElementById("addBreak").addEventListener("click", createBreak);
    arrival.addEventListener("input", calculate);
    timeCredit.addEventListener("input", calculate);

    // Start with no breaks.
    calculate();
  </script>
</body>
</html>
